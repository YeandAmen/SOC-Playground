# 05-detection / savedsearches.conf
# Detection searches for each simulated attack. Deploy to the Splunk manager:
#   /Applications/Splunk/etc/apps/soc_capstone_detections/local/savedsearches.conf
# then:  /Applications/Splunk/bin/splunk restart
# (or create the app dir + reload via the UI). Each search is also runnable
# ad-hoc in the Splunk search bar.
# ---- a) Attk101 Brute Force — failed logons by source IP (threshold 10/5m) ----
[SOC - Attk101 SSH Brute Force (Linux)]
search = index=soc_capstone sourcetype=linux_secure "Failed password"
        | stats count, dc(user) as users_tried, values(user) as users
          by host
        | where count >= 10
        | sort - count
dispatch.earliest_time = -5m
dispatch.latest_time   = now
alert.severity         = 3
action.email           = 0

[SOC - Attk101 Windows Brute Force (4625)]
search = index=soc_capstone (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational)
        (EventCode=4625 OR "EventID>4625<")
        | stats count, dc(Account_Name) as accounts, values(Account_Name) as accounts_tried
          by host
        | where count >= 10
        | sort - count
dispatch.earliest_time = -5m
dispatch.latest_time   = now
alert.severity         = 3

# ---- b) Attk102 Local Account Creation (Security 4720 + admin add 4728/4732) -
[SOC - Attk102 Local Account Created]
search = index=soc_capstone sourcetype=WinEventLog:Security EventCode=4720
        | stats count, values(Account_Name) as new_account,
          values(Security_ID) as sid by host, _time
        | sort - _time
dispatch.earliest_time = -24h
dispatch.latest_time   = now
alert.severity         = 4

[SOC - Attk102 Account Added to Administrators]
search = index=soc_capstone sourcetype=WinEventLog:Security (EventCode=4728 OR EventCode=4732 OR EventCode=4738)
        | stats count, values(Account_Name) as account,
          values(TargetUserName) as target by host, _time
        | sort - _time
dispatch.earliest_time = -24h
dispatch.latest_time   = now
alert.severity         = 5

# ---- c) Attk103 PowerShell Download & Execute (Sysmon EID 1 + EID 3) -------
[SOC - Attk103 PowerShell Download Cradle]
search = index=soc_capstone sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventID=1
        (Image="*\\powershell.exe" OR Image="*\\pwsh.exe")
        (CommandLine="*DownloadString*" OR CommandLine="*DownloadFile*"
         OR CommandLine="*Invoke-WebRequest*" OR CommandLine="*iex*"
         OR CommandLine="*Net.WebClient*" OR CommandLine="*EncodedCommand*")
        | stats count, values(Image) as proc, values(CommandLine) as cmd,
          values(ParentImage) as parent by host, User, _time
        | sort - _time
dispatch.earliest_time = -24h
dispatch.latest_time   = now
alert.severity         = 4

[SOC - Attk103 Network Connect From PowerShell]
search = index=soc_capstone sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventID=3
        (Image="*\\powershell.exe" OR Image="*\\pwsh.exe")
        | stats count, values(DestinationIp) as dest_ip,
          values(DestinationPort) as dest_port by host, _time
        | sort - _time
dispatch.earliest_time = -15m
dispatch.latest_time   = now
alert.severity         = 3

# ---- d) Attk104 Clear Windows Security Log (EID 1102 + Sysmon EID 4) -------
[SOC - Attk104 Security Log Cleared]
search = index=soc_capstone (sourcetype=WinEventLog:Security EventCode=1102)
        OR (sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational "EventID>4<")
        | stats count by host, _time
        | sort - _time
dispatch.earliest_time = -24h
dispatch.latest_time   = now
alert.severity         = 5
