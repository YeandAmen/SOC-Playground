<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Computer Node Topology</title>
  <desc id="desc">Literal computers connected to a central switch in the isolated UTM SOC lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#edf3f6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#263238" flood-opacity="0.18"/></filter>
    <style>
      .title{font:800 48px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102027}.sub{font:500 23px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52646d}.label{font:800 24px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102027}.mono{font:800 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#263b44}.small{font:600 18px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4f6068}.line{stroke:#768b94;stroke-width:4;fill:none}.tele{stroke:#1d7f6e;stroke-width:5;fill:none}.attack{stroke:#b84b4b;stroke-width:4;stroke-dasharray:12 9;fill:none}.screen{fill:#eef5f7;stroke:#758991;stroke-width:4}.case{fill:#f7fafb;stroke:#758991;stroke-width:4}.stand{fill:#d8e4e8;stroke:#758991;stroke-width:4}.switch{fill:#f4f7f8;stroke:#697f88;stroke-width:4}.port{fill:#1d7f6e}.boundary{fill:none;stroke:#a7bac2;stroke-width:3;stroke-dasharray:14 12}.chip{fill:#e8f0f3;stroke:#b9cbd2;stroke-width:2}.chipText{font:800 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#30444c}.caption{font:800 18px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d6158}.redcap{font:800 18px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9b3c3c}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="url(#bg)"/>
  <text x="88" y="90" class="title">Computer Node Topology</text>
  <text x="90" y="128" class="sub">Literal computer nodes connected through the isolated UTM lab switch.</text>
  <rect x="75" y="178" width="1650" height="780" rx="30" class="boundary"/>
  <text x="112" y="228" class="label">UTM Virtual Network</text>
  <text x="112" y="262" class="mono">192.168.64.0/24</text>

  <g transform="translate(805 465)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="90" rx="18" class="switch"/>
    <rect x="30" y="30" width="22" height="14" rx="3" class="port"/><rect x="64" y="30" width="22" height="14" rx="3" class="port"/><rect x="98" y="30" width="22" height="14" rx="3" class="port"/><rect x="132" y="30" width="22" height="14" rx="3" class="port"/>
    <text x="40" y="72" class="chipText">LAB SWITCH</text>
  </g>

  <path d="M805 508 L520 362" class="tele"/><path d="M995 508 L1280 362" class="tele"/><path d="M900 465 L900 322" class="tele"/><path d="M850 555 L600 745" class="line"/><path d="M950 555 L1200 745" class="attack"/>

  <g transform="translate(695 205)" filter="url(#shadow)">
    <rect x="0" y="0" width="410" height="55" rx="12" class="chip"/><text x="34" y="36" class="label">Splunk Manager</text><text x="245" y="36" class="mono">192.168.64.1</text>
    <rect x="112" y="80" width="170" height="190" rx="12" fill="#f1efe5" stroke="#857d69" stroke-width="4"/>
    <rect x="137" y="109" width="120" height="16" rx="4" fill="#d1c9ac"/><circle cx="155" cy="232" r="11" fill="#52c7b8"/><rect x="185" y="224" width="60" height="16" rx="4" fill="#c4baa0"/>
    <text x="94" y="310" class="small">Splunk Enterprise Manager</text>
    <text x="94" y="338" class="small">Indexer / Search Head / Receiver</text>
    <text x="94" y="366" class="small">SignalScope local console</text>
  </g>

  <g transform="translate(205 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="365" height="55" rx="12" class="chip"/><text x="24" y="36" class="label">Windows Endpoint</text>
    <rect x="92" y="88" width="165" height="122" rx="10" class="screen"/><rect x="118" y="112" width="112" height="66" rx="6" fill="#cbdde3"/><rect x="150" y="210" width="45" height="42" class="stand"/><rect x="106" y="252" width="134" height="24" rx="8" class="stand"/>
    <text x="84" y="314" class="mono">192.168.64.2</text><text x="84" y="344" class="small">Sysmon + Splunk UF</text>
  </g>

  <g transform="translate(1230 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="55" rx="12" class="chip"/><text x="24" y="36" class="label">Kali Endpoint</text>
    <path d="M92 202 L139 88 L276 140 L224 250 Z" class="case"/><rect x="126" y="115" width="110" height="70" rx="6" fill="#cbdde3"/><path d="M92 202 L224 250 L192 278 L62 229 Z" class="stand"/>
    <text x="72" y="314" class="mono">192.168.64.4</text><text x="72" y="344" class="small">OpenSSH + Splunk UF</text>
  </g>

  <g transform="translate(365 700)" filter="url(#shadow)">
    <rect x="0" y="0" width="395" height="55" rx="12" class="chip"/><text x="24" y="36" class="label">SOC Analyst Console</text>
    <rect x="108" y="84" width="175" height="125" rx="10" class="screen"/><rect x="135" y="108" width="120" height="68" rx="6" fill="#cbdde3"/><rect x="143" y="210" width="105" height="24" rx="8" class="stand"/>
    <text x="76" y="276" class="small">Splunk Web + SignalScope</text><text x="76" y="306" class="mono">127.0.0.1:8765</text>
  </g>

  <g transform="translate(1095 700)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="55" rx="12" class="chip"/><text x="24" y="36" class="label">Evidence Output</text>
    <rect x="100" y="95" width="150" height="105" rx="12" class="case"/><rect x="120" y="67" width="110" height="65" rx="7" fill="#f8fafb" stroke="#758991" stroke-width="4"/><rect x="125" y="125" width="100" height="16" rx="4" fill="#52c7b8"/><rect x="115" y="165" width="120" height="52" rx="8" fill="#d8e4e8" stroke="#758991" stroke-width="4"/>
    <text x="72" y="278" class="small">PDF report diagrams</text><text x="72" y="308" class="mono">06-deliverables</text>
  </g>

  <text x="470" y="420" class="caption">Windows telemetry</text><text x="500" y="447" class="caption">TCP 9997</text>
  <text x="1135" y="420" class="caption">Linux telemetry</text><text x="1175" y="447" class="caption">TCP 9997</text>
  <text x="990" y="690" class="redcap">attack simulation</text><text x="1015" y="717" class="redcap">and evidence</text>
</svg>
