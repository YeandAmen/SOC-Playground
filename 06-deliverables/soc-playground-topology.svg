<text x="60" y="492" font-size="12.5" fill="#111">Dotted arrow: Kali → Windows (RDP 3389, SSH 22), observed in Sysmon on Windows.</text>
<text x="60" y="510" font-size="12.5" fill="#111">Dashed arrows: SSH 22 (Mac → VMs), observed in Splunk telemetry. Attk101 attack source: Mac → Kali.</text>
<text x="60" y="528" font-size="12.5" fill="#111">Telemetry stays inside the lab network and is forwarded only to the Splunk Manager.</text>
<text x="60" y="546" font-size="12.5" fill="#111">The live console and management API are bound to loopback for local analyst use.</text>

