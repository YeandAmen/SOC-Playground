title: SSH Password Brute Force
id: RULE-ATTK101-001
status: test
description: Detects multiple failed SSH logins from same source (password guessing)
logsource: {product: linux, service: auth}
detection:
  selection:
    msg|contains: "Failed password"
  condition: selection
  timeframe: 5m
  threshold: 10
falsepositives: [Misconfigured services, Scripted admin tasks]
level: medium
tags: [attack.credential_access, attack.attk101]
custom:
  owner: analyst
  last_tuned: 2026-10-04
  validated_by: SIM-001
  data_sources: [linux_secure]

