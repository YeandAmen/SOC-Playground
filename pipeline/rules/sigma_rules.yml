title: PowerShell Download Cradle
id: RULE-ATTK103-001
status: test
description: Detects PowerShell execution with download-and-execute indicators
logsource: {product: windows, service: sysmon}
detection:
  selection:
    Image|endswith: ['\powershell.exe', '\pwsh.exe']
    CommandLine|contains: ['DownloadString', 'DownloadFile', 'Invoke-WebRequest', 'Net.WebClient', 'EncodedCommand']
  condition: selection
falsepositives: [Legitimate scripted deployments, authorized update mechanisms]
level: high
tags: [attack.execution, attack.attk103]
custom:
  owner: analyst
  last_tuned: 2026-10-04
  validated_by: SIM-003
  data_sources: [XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]

